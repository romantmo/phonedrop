# CI/CD — «непрерывная проверка, сборка и выкладка».
# Каждый раз, когда код попадает в ветку main, робот GitHub:
#   1) запускает автотесты;                                        (CI)
#   2) если тесты прошли — собирает Docker-образ («коробку»),
#      проверяет, что он запускается, и кладёт его в хранилище GitHub;   (CI)
#   3) заходит на сервер своим ограниченным ключом и запускает deploy.sh,
#      а потом проверяет снаружи, что сайт отвечает новой версией.        (CD)
# Если любой шаг упал — следующие не запускаются, и сайт остаётся на старой рабочей версии.

name: CI/CD

on:
  push:
    branches: [main]   # каждый push в основную ветку
  pull_request:        # и каждый Pull Request (о них — позже)

permissions:
  contents: read       # по умолчанию роботу можно только читать код

jobs:
  test:
    name: Автотесты
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Скачать код проекта
        uses: actions/checkout@v7

      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip   # запомнить скачанные библиотеки — следующий запуск быстрее

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      - name: Запустить тесты
        run: pytest -v

      - name: Проверить синтаксис JavaScript
        # Ошибка в одном .js ломает всю страницу, а Python-тесты её не заметят.
        run: for f in app/static/*.js; do node --check "$f"; done

  docker:
    name: Docker-образ
    needs: test        # начинается, только если автотесты прошли
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # право положить образ в хранилище GitHub Packages
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Скачать код проекта
        uses: actions/checkout@v7

      - name: Подготовить сборщик Docker
        uses: docker/setup-buildx-action@v4

      - name: Собрать образ по Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true                              # оставить образ здесь, чтобы проверить
          tags: phonedrop:check
          build-args: APP_VERSION=${{ github.sha }} # номер коммита станет версией
          cache-from: type=gha                    # запоминать слои — следующая сборка быстрее
          cache-to: type=gha,mode=max

      - name: Проверить, что «коробка» запускается
        run: |
          docker run -d --name check -p 8000:8000 phonedrop:check
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz | grep -q "${{ github.sha }}"; then
              echo "Приложение в контейнере отвечает, версия ${{ github.sha }}"
              exit 0
            fi
            sleep 1
          done
          echo "Приложение не запустилось. Журнал контейнера:"
          docker logs check
          exit 1

      - name: Проверить конвертер (Word → PDF внутри «коробки»)
        run: |
          docker run -d --name conv -p 8001:8001 phonedrop:check \
            uvicorn converter.main:app --host 0.0.0.0 --port 8001
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8001/healthz | grep -q '"office":true' && break
            sleep 1
          done
          curl -fsS -F "files=@tests/fixtures/sample.docx" http://127.0.0.1:8001/convert/office-pdf -o result.zip
          python3 -c "
          import zipfile
          data = zipfile.ZipFile('result.zip').read('000.pdf')
          assert data.startswith(b'%PDF'), 'это не PDF'
          print('Word → PDF работает, размер PDF:', len(data), 'байт')
          "

      - name: Войти в хранилище образов GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # временный ключ, GitHub выдаёт его сам

      - name: Отправить образ в хранилище
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag phonedrop:check "$IMAGE:latest"
          docker tag phonedrop:check "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          echo "Готово: $IMAGE:${{ github.sha }}"

  deploy:
    name: Выкладка на сервер
    needs: docker      # только после успешной сборки образа
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production                 # на GitHub появится раздел «Deployments»
      url: https://drop.rbgen.com
    concurrency:
      group: production                # две выкладки одновременно не запускаются
      cancel-in-progress: false
    steps:
      - name: Подготовить ключ робота
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # tr -d '\r' убирает «виндовые» переносы строк, если ключ вставляли из Windows
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts   # «отпечаток» нашего сервера

      - name: Обновить сайт на сервере (deploy.sh)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Ключ робота умеет только запускать deploy.sh. Передаём ему номер версии.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "root@$HOST" "${{ github.sha }}"

      - name: Проверить сайт снаружи
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://drop.rbgen.com/healthz | grep -q "${{ github.sha }}"; then
              echo "Сайт работает на новой версии ${{ github.sha }} ✅"
              exit 0
            fi
            sleep 3
          done
          echo "Сайт не ответил новой версией" >&2
          exit 1

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/deploy
