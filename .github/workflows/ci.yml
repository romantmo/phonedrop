# CI — «непрерывная проверка и сборка».
# Каждый раз, когда код попадает на GitHub, робот GitHub:
#   1) запускает автотесты;
#   2) если тесты прошли — собирает Docker-образ («коробку» с приложением),
#      проверяет, что он запускается, и кладёт его в хранилище GitHub (ghcr.io).

name: CI

on:
  push:
    branches: [main]   # каждый push в основную ветку
  pull_request:        # и каждый Pull Request (о них — позже)

permissions:
  contents: read       # по умолчанию роботу можно только читать код

jobs:
  test:
    name: Автотесты
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Скачать код проекта
        uses: actions/checkout@v7

      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip   # запомнить скачанные библиотеки — следующий запуск быстрее

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      - name: Запустить тесты
        run: pytest -v

  docker:
    name: Docker-образ
    needs: test        # начинается, только если автотесты прошли
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # право положить образ в хранилище GitHub Packages
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Скачать код проекта
        uses: actions/checkout@v7

      - name: Подготовить сборщик Docker
        uses: docker/setup-buildx-action@v4

      - name: Собрать образ по Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true                              # оставить образ здесь, чтобы проверить
          tags: phonedrop:check
          build-args: APP_VERSION=${{ github.sha }} # номер коммита станет версией
          cache-from: type=gha                    # запоминать слои — следующая сборка быстрее
          cache-to: type=gha,mode=max

      - name: Проверить, что «коробка» запускается
        run: |
          docker run -d --name check -p 8000:8000 phonedrop:check
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz | grep -q "${{ github.sha }}"; then
              echo "Приложение в контейнере отвечает, версия ${{ github.sha }}"
              exit 0
            fi
            sleep 1
          done
          echo "Приложение не запустилось. Журнал контейнера:"
          docker logs check
          exit 1

      - name: Войти в хранилище образов GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # временный ключ, GitHub выдаёт его сам

      - name: Отправить образ в хранилище
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag phonedrop:check "$IMAGE:latest"
          docker tag phonedrop:check "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          echo "Готово: $IMAGE:${{ github.sha }}"
