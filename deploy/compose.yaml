# compose.yaml — инструкция для сервера: какие «коробки» запускать и как их соединить.
# Запуск: docker compose up -d   (в папке /opt/phonedrop на сервере)
#
# Четыре коробки:
#   app       — наше приложение PhoneDrop (берётся из хранилища GitHub);
#   converter — конвертер файлов (тот же образ, другая команда). Сидит во внутренней
#               сети без интернета, не видит базу и переписки, ограничен по памяти;
#   caddy     — «привратник»: принимает посетителей из интернета, сам получает
#               HTTPS-сертификат (замочек) и передаёт запросы приложению;
#   turn      — TURN-сервер для звонков (coturn): пересылает звук и видео, когда телефоны
#               не могут соединиться напрямую. Разговор зашифрован, coturn его не видит.

services:
  app:
    # Версию (номер коммита) подставляет deploy.sh. Вручную без неё — последняя версия.
    image: ghcr.io/romantmo/phonedrop:${APP_TAG:-latest}
    restart: unless-stopped              # упало или сервер перезагрузился — запустить снова
    environment:
      PUBLIC_URL: https://drop.rbgen.com # адрес сайта для QR-кода и входа через Google
      VAPID_SUBJECT: https://drop.rbgen.com
    # Секреты (ключ входа через Google, список разрешённых email) лежат ТОЛЬКО на сервере
    # в файле /opt/phonedrop/.env (права 600). В GitHub и в коде их нет.
    env_file:
      - path: .env
        required: false
    volumes:
      - phonedrop-data:/data             # база и файлы живут отдельно от коробки
    security_opt:
      - no-new-privileges:true           # приложению нельзя повышать себе права
    cap_drop:
      - ALL                              # и не нужны никакие особые права Linux
    networks:
      - default                          # сеть с Caddy и интернетом (нужен для push-уведомлений)
      - convert                          # внутренняя сеть до конвертера
    depends_on:
      - converter
    # Порт наружу НЕ открываем: снаружи приложение доступно только через Caddy.

  converter:
    image: ghcr.io/romantmo/phonedrop:${APP_TAG:-latest}
    command: ["uvicorn", "converter.main:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped
    networks:
      - convert                          # ТОЛЬКО внутренняя сеть: ни интернета, ни Caddy
    environment:
      HOME: /tmp
    read_only: true                      # менять файлы внутри коробки нельзя...
    tmpfs:
      - /tmp:size=1536m                  # ...кроме временной папки в памяти (очищается при перезапуске)
    mem_limit: 1536m                     # даже «тяжёлый» документ не съест всю память сервера
    cpus: 1.5
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"                          # нужен для получения сертификата и перенаправления на HTTPS
      - "443:443"                        # HTTPS — сам сайт
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data                 # здесь хранится сертификат, чтобы не получать его заново
      - caddy-config:/config
    depends_on:
      - app

  turn:
    image: coturn/coturn:4-alpine        # официальный образ; работает от пользователя nobody
    restart: unless-stopped
    # Сеть сервера напрямую: coturn нужен диапазон портов, Docker с ним работает плохо.
    # Порты в файрволе Hetzner: 3478 TCP+UDP и 49160-49200 UDP.
    network_mode: host
    env_file:
      - path: .env                       # TURN_SECRET — общий секрет с приложением (только на сервере)
        required: false
    read_only: true
    tmpfs:
      - /var/lib/coturn
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # В образе coturn программе turnserver выдано право занимать порты (setcap). Без этого
      # права в контейнере Linux её не запускает: «Operation not permitted». Остальные права отняты.
      - NET_BIND_SERVICE
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -z "$$TURN_SECRET" ]; then
          echo "TURN_SECRET не задан в /opt/phonedrop/.env — TURN выключен, звонки только напрямую"
          while true; do sleep 3600; done
        fi
        exec turnserver -n --log-file=stdout --no-cli --no-tls --no-dtls \
          --listening-port=3478 --min-port=49160 --max-port=49200 \
          --use-auth-secret --static-auth-secret="$$TURN_SECRET" --realm=drop.rbgen.com \
          --fingerprint --no-software-attribute --stale-nonce=600 \
          --user-quota=12 --total-quota=100 --max-bps=3000000 \
          --no-multicast-peers \
          --denied-peer-ip=0.0.0.0-0.255.255.255 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.0.0.0-192.0.0.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          --denied-peer-ip=198.18.0.0-198.19.255.255 \
          --denied-peer-ip=240.0.0.0-255.255.255.255 \
          --denied-peer-ip=::1 \
          --denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255 \
          --denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff \
          --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
        # denied-peer-ip: через TURN нельзя достучаться до внутренних адресов сервера и сетей Docker.

networks:
  convert:
    internal: true                       # из этой сети нет выхода в интернет

volumes:
  phonedrop-data:
  caddy-data:
  caddy-config:
