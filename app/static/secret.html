<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>PhoneDrop — одноразовая ссылка</title>
<link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/chat.css">
<link rel="stylesheet" href="/static/tools.css">
</head>
<body data-role="secret">
<main class="secret-page">
  <section class="secret-box" id="secretBox">
    <h1>🔑 Одноразовая ссылка</h1>
    <p id="secretInfo">Проверяю ссылку…</p>
    <pre class="secret-text" id="secretText" hidden></pre>
    <button class="btn primary block" id="secretOpen" type="button" hidden>Показать</button>
    <button class="btn block" id="secretCopy" type="button" hidden>📋 Скопировать</button>
    <p class="tool-note">Текст зашифрован. Ключ есть только в этой ссылке — сервер PhoneDrop прочитать его не может.</p>
  </section>
</main>
<script src="/static/i18n-words.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/secret.js"></script>
</body>
</html>
